name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: cd skills && zip -r ../claude-i18n-style.zip claude-i18n-style -x '*/__pycache__/*' '*.DS_Store'
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" claude-i18n-style.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
